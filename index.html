<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Court's Library</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');:root{--bg:#080808;--line:#292929;--red:#ff1744;--pink:#ff3ea5;--lime:#b6ff00;--text:#eee}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:VT323,monospace;font-size:21px}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px);z-index:20}.app{height:100%;display:grid;grid-template-rows:62px 1fr}.top{display:flex;align-items:center;padding:0 18px;border-bottom:2px solid var(--red);background:#0b0b0b}.logo{font:14px 'Press Start 2P';text-shadow:3px 3px var(--red)}.status{margin-left:auto;color:var(--lime);font-size:18px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--lime);margin-right:7px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.2}}.main{height:100%;min-height:0;display:grid;grid-template-columns:180px 1fr 330px}.side{padding:14px;border-right:2px solid var(--line);background:#0c0c0c}.navlabel,.title{font:9px 'Press Start 2P';color:#666;margin:6px 0 12px}.nav button,.button{width:100%;margin:0 0 7px;padding:10px;border:2px solid #333;background:#151515;color:#ddd;font:20px VT323;text-align:left;cursor:pointer;box-shadow:3px 3px #000}.nav button:hover,.button:hover{border-color:var(--pink)}.nav .active{border-color:var(--red);color:#fff}.center{min-width:0;min-height:0;display:grid;grid-template-rows:1fr 220px}.preview{min-height:0;padding:16px;background:#050505}.screen{width:100%;height:100%;border:4px solid #303030;background:#000;box-shadow:8px 8px #000}.screen iframe{width:100%;height:100%;border:0;background:#000}.placeholder{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#666}.placeholder h1{font:16px 'Press Start 2P';line-height:1.8;color:var(--red)}.console{min-height:0;border-top:2px solid var(--line);display:grid;grid-template-columns:1fr 115px;background:#0c0c0c}.editor{padding:10px;min-width:0}.tabs{display:flex;gap:5px;margin-bottom:7px;overflow:auto}.tab{padding:4px 8px;background:#151515;border:1px solid #333;color:#888;cursor:pointer;font:18px VT323}.tab.active{color:#fff;border-color:var(--red)}textarea{width:100%;height:172px;resize:none;outline:none;border:2px solid #292929;background:#050505;color:#caff9a;padding:10px;font:17px VT323;line-height:1.2}.controls{padding:10px;border-left:2px solid var(--line)}.controls .button{text-align:center;font-family:'Press Start 2P';font-size:9px}.controls .play{background:var(--red);border-color:#ff6680;color:#fff}.right{min-width:0;display:flex;flex-direction:column;padding:14px;border-left:2px solid var(--line);background:#0c0c0c}.chat{flex:1;min-height:0;overflow:auto;border:2px solid #292929;background:#070707;padding:10px;margin-bottom:8px}.msg{margin-bottom:9px;line-height:1.05}.me{color:var(--pink)}.bot{color:var(--lime)}.send{display:grid;grid-template-columns:1fr 58px;gap:5px}.field{width:100%;padding:9px;border:2px solid #333;outline:0;background:#070707;color:#fff;font:18px VT323}.field:focus{border-color:var(--red)}.send .button{text-align:center;background:var(--red);color:#fff;border-color:#ff6680;margin:0}.asset{margin-top:8px;padding:9px;border:2px dashed #333;text-align:center;color:#777;cursor:pointer}.asset:hover{border-color:var(--lime);color:#aaa}.assets{margin-top:8px;max-height:85px;overflow:auto;color:#777;font-size:17px}.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:#000d;padding:20px}.modal.show{display:flex}.modalbox{width:min(520px,100%);padding:20px;background:#111;border:3px solid var(--red);box-shadow:8px 8px #000}.modalbox h2{font:13px 'Press Start 2P';color:var(--red)}.modalbox p{color:#999;line-height:1.1}.modalbox .button{text-align:center}.project-list{max-height:280px;overflow:auto}.project{padding:9px;border-bottom:1px solid #292929;cursor:pointer}.project:hover{color:var(--lime)}@media(max-width:850px){.main{grid-template-columns:1fr}.side{display:none}.right{border-left:0;border-top:2px solid var(--line)}.center{height:650px}.controls{display:none}}</style></head><body><div class="app"><header class="top"><div class="logo">COURT'S LIBRARY</div><div class="status"><span class="dot"></span>BOTPRESS</div></header><main class="main"><aside class="side"><div class="navlabel">LIBRARY</div><nav class="nav"><button class="active" data-view="create">CREATE</button><button data-view="projects">PROJECTS</button><button data-view="assets">ASSETS</button><button id="botpressBtn">BOTPRESS</button></nav></aside><section class="center"><div class="preview"><div class="screen" id="gameScreen"><div class="placeholder"><div><h1>YOUR GAME<br>WILL LIVE HERE</h1><div>Ask Court's AI to build it.</div></div></div></div></div><div class="console"><div class="editor"><div class="tabs" id="tabs"></div><textarea id="code" spellcheck="false"></textarea></div><div class="controls"><button class="button play" id="play">PLAY</button><button class="button" id="save">SAVE</button><button class="button" id="export">EXPORT</button></div></div></section><aside class="right"><div class="title">COURT'S AI</div><div class="chat" id="chat"><div class="msg bot"><b>BOTPRESS:</b> Ready.</div></div><div class="send"><input class="field" id="prompt" placeholder="describe your game..." autocomplete="off"><button class="button" id="go">GO</button></div><label class="asset">ADD ASSET<input id="assetInput" type="file" hidden multiple accept="image/*,audio/*,.gif"></label><div class="assets" id="assetList"></div></aside></main></div><div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">BOTPRESS</h2><div id="modalBody"></div><button class="button" id="modalClose">CLOSE</button></div></div><script>const BOTPRESS_WEBHOOK='https://webhook.botpress.cloud/399b27df-823d-4790-912c-5e3e5baaa018';const DEFAULT={'index.html':'<div id="game"><h1>Court\'s Library</h1></div>','style.css':'body{margin:0;background:#111;color:white;font-family:monospace}#game{text-align:center;padding:40px}','game.js':'console.log("Court\'s Library game");'};const state={files:{...DEFAULT},current:'index.html',assets:[]};const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function tabs(){$('tabs').innerHTML=Object.keys(state.files).map(f=>'<button class="tab '+(f===state.current?'active':'')+'" data-file="'+esc(f)+'">'+esc(f)+'</button>').join('');$('code').value=state.files[state.current]||'';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{saveCode();state.current=b.dataset.file;tabs()})}function saveCode(){state.files[state.current]=$('code').value}function msg(who,text){$('chat').insertAdjacentHTML('beforeend','<div class="msg '+(who==='YOU'?'me':'bot')+'"><b>'+who+':</b> '+esc(text).replace(/\n/g,'<br>')+'</div>');$('chat').scrollTop=$('chat').scrollHeight}function save(){saveCode();localStorage.setItem('courts_library_project',JSON.stringify({files:state.files,assets:state.assets}));msg('BOT','Project saved.')}function load(){try{const x=JSON.parse(localStorage.getItem('courts_library_project'));if(x?.files){state.files=x.files;state.assets=x.assets||[]}}catch{}tabs();renderAssets()}function run(){saveCode();const html=state.files['index.html']||'';const css=state.files['style.css']||'';const js=state.files['game.js']||'';$('gameScreen').innerHTML='<iframe sandbox="allow-scripts" title="game"></iframe>';const frame=$('gameScreen').querySelector('iframe');const doc=frame.contentDocument;doc.open();doc.write(html+'<style>'+css+'</style><script>'+js.replace(/<\/script>/gi,'<\\/script>')+'<\/script>');doc.close()}function download(){saveCode();const blob=new Blob([JSON.stringify(state.files,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='courts-library-project.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function show(title,body){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('show')}function projects(){const saved=localStorage.getItem('courts_library_project');show('PROJECTS',saved?'<div class="project-list"><div class="project" id="loadProject">CURRENT PROJECT</div></div>':'<p>No saved project.</p>');$('loadProject')?.addEventListener('click',()=>{load();$('modal').classList.remove('show');msg('BOT','Project loaded.')})}function botpress(){show('BOTPRESS','<p>Court\'s Library is connected to your public Botpress webhook.</p><p style="word-break:break-all">'+esc(BOTPRESS_WEBHOOK)+'</p>')}function renderAssets(){$('assetList').innerHTML=state.assets.map(a=>esc(a.name)).join('<br>')}$('assetInput').onchange=e=>{state.assets.push(...[...e.target.files].map(f=>({name:f.name,type:f.type})));renderAssets();save()};async function send(){const p=$('prompt').value.trim();if(!p)return;saveCode();$('prompt').value='';msg('YOU',p);msg('BOT','BUILDING...');const system=`You are the game-building AI for Court's Library. Build a complete playable browser game from the user's request. Return ONLY valid JSON: {"message":"short status","files":{"index.html":"...","style.css":"...","game.js":"..."}}. Use vanilla HTML/CSS/JavaScript only. The game must run inside an iframe on GitHub Pages. Make it functional, not a mockup. Respect requested style such as PS2, punk, low-poly, CRT. Preserve and improve existing files when appropriate. User request: ${p}\nExisting files: ${JSON.stringify(state.files)}\nAvailable custom assets: ${JSON.stringify(state.assets)}`;try{const r=await fetch(BOTPRESS_WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:system,message:system,query:system})});const raw=await r.text();let data;try{data=JSON.parse(raw)}catch{data=raw}const text=typeof data==='string'?data:(data?.message?.content||data?.text||data?.message||JSON.stringify(data));let out=null;try{out=JSON.parse(String(text).replace(/^```json\s*|\s*```$/g,''))}catch{}if(out?.files){state.files={...state.files,...out.files};state.current=out.files['index.html']?'index.html':Object.keys(out.files)[0]||state.current;tabs();run();save();msg('BOT',out.message||'Game generated.')}else msg('BOT',String(text))}catch(e){msg('BOT','Botpress request failed: '+e.message)}}$('go').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter')send()};$('play').onclick=run;$('save').onclick=save;$('export').onclick=download;$('modalClose').onclick=()=>$('modal').classList.remove('show');$('botpressBtn').onclick=botpress;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='projects')projects();if(b.dataset.view==='assets')show('ASSETS','<p>Add your GIFs, images, and audio with ADD ASSET.</p>')});load();</script></body></html>
