<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Court's Library</title><style>@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap');*{box-sizing:border-box}html,body{margin:0;height:100%;background:#080808;color:#eee;font:21px VT323,monospace;overflow:hidden}body:after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#fff1 4px)}.app{height:100%;display:grid;grid-template-rows:60px 1fr}.top{display:flex;align-items:center;padding:0 16px;border-bottom:2px solid #ff1744;background:#0b0b0b}.logo{font:14px 'Press Start 2P';text-shadow:3px 3px #ff1744}.status{margin-left:auto;color:#b6ff00}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#b6ff00;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}.main{display:grid;grid-template-columns:170px 1fr 330px;min-height:0}.side,.right{background:#0c0c0c;padding:12px}.side{border-right:2px solid #292929}.right{border-left:2px solid #292929;display:flex;flex-direction:column}.label{font:9px 'Press Start 2P';color:#666;margin:6px 0 10px}.nav button,.button{display:block;width:100%;margin-bottom:7px;padding:9px;border:2px solid #333;background:#151515;color:#ddd;font:20px VT323;cursor:pointer;box-shadow:3px 3px #000}.nav button:hover,.button:hover{border-color:#ff3ea5}.nav .active{border-color:#ff1744;color:#fff}.center{display:grid;grid-template-rows:1fr 215px;min-width:0;min-height:0}.preview{padding:14px;background:#050505;min-height:0}.screen{height:100%;border:4px solid #303030;background:#000}.screen iframe{width:100%;height:100%;border:0}.placeholder{height:100%;display:grid;place-items:center;text-align:center;color:#666}.placeholder h1{font:15px 'Press Start 2P';line-height:1.8;color:#ff1744}.console{display:grid;grid-template-columns:1fr 110px;border-top:2px solid #292929;background:#0c0c0c;min-height:0}.editor{padding:9px;min-width:0}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:6px}.tab{padding:3px 7px;background:#151515;border:1px solid #333;color:#888;cursor:pointer;font:18px VT323}.tab.active{color:#fff;border-color:#ff1744}textarea{width:100%;height:170px;resize:none;background:#050505;color:#caff9a;border:2px solid #292929;outline:0;padding:9px;font:17px VT323}.controls{padding:9px;border-left:2px solid #292929}.play{background:#ff1744!important;color:#fff!important;border-color:#ff6680!important}.chat{flex:1;min-height:0;overflow:auto;border:2px solid #292929;background:#070707;padding:9px;margin-bottom:7px}.msg{margin-bottom:8px;line-height:1.05}.me{color:#ff3ea5}.bot{color:#b6ff00}.send{display:grid;grid-template-columns:1fr 58px;gap:5px}.field{width:100%;padding:8px;border:2px solid #333;background:#070707;color:#fff;outline:0;font:18px VT323}.send .button{margin:0;background:#ff1744;color:#fff;border-color:#ff6680;text-align:center}.asset{margin-top:7px;padding:8px;border:2px dashed #333;text-align:center;color:#777;cursor:pointer}.assets{margin-top:6px;color:#777;font-size:17px;max-height:70px;overflow:auto}.modal{position:fixed;inset:0;display:none;place-items:center;background:#000d;z-index:10}.modal.show{display:grid}.box{width:min(500px,90%);padding:18px;background:#111;border:3px solid #ff1744}.box h2{font:13px 'Press Start 2P';color:#ff1744}.box p{color:#999}.project{padding:8px;border-bottom:1px solid #292929;cursor:pointer}.project:hover{color:#b6ff00}@media(max-width:850px){.main{grid-template-columns:1fr}.side{display:none}.right{border-left:0;border-top:2px solid #292929}.center{height:620px}.controls{display:none}}</style></head><body><div class="app"><header class="top"><div class="logo">COURT'S LIBRARY</div><div class="status"><span class="dot"></span> BOTPRESS</div></header><main class="main"><aside class="side"><div class="label">LIBRARY</div><nav class="nav"><button class="active" data-view="create">CREATE</button><button data-view="projects">PROJECTS</button><button data-view="assets">ASSETS</button><button id="bp">BOTPRESS</button></nav></aside><section class="center"><div class="preview"><div class="screen" id="screen"><div class="placeholder"><div><h1>YOUR GAME<br>WILL LIVE HERE</h1>Describe a game to Court's AI.</div></div></div></div><div class="console"><div class="editor"><div class="tabs" id="tabs"></div><textarea id="code"></textarea></div><div class="controls"><button class="button play" id="play">PLAY</button><button class="button" id="save">SAVE</button><button class="button" id="export">EXPORT</button></div></div></section><aside class="right"><div class="label">COURT'S AI</div><div class="chat" id="chat"><div class="msg bot"><b>BOTPRESS:</b> Ready.</div></div><div class="send"><input class="field" id="prompt" placeholder="describe your game..."><button class="button" id="go">GO</button></div><label class="asset">ADD ASSET<input id="assetInput" type="file" hidden multiple accept="image/*,audio/*,.gif"></label><div class="assets" id="assets"></div></aside></main></div><div class="modal" id="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><button class="button" id="close">CLOSE</button></div></div><script>const WEBHOOK='https://webhook.botpress.cloud/399b27df-823d-4790-912c-5e3e5baaa018';const DEFAULT={'index.html':'<div id="game"><h1>Court\'s Library</h1></div>','style.css':'body{margin:0;background:#111;color:#fff;font-family:monospace}#game{text-align:center;padding:40px}','game.js':'console.log("Court\'s Library game");'};let state={files:{...DEFAULT},current:'index.html',assets:[]};const $=x=>document.getElementById(x);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){ $('tabs').innerHTML=Object.keys(state.files).map(f=>'<button class="tab '+(f===state.current?'active':'')+'" data-f="'+esc(f)+'">'+esc(f)+'</button>').join('');$('code').value=state.files[state.current]||'';document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{saveCode();state.current=b.dataset.f;render()})}function saveCode(){state.files[state.current]=$('code').value}function message(who,text){$('chat').insertAdjacentHTML('beforeend','<div class="msg '+(who==='YOU'?'me':'bot')+'"><b>'+who+':</b> '+esc(text).replace(/\n/g,'<br>')+'</div>');$('chat').scrollTop=$('chat').scrollHeight}function save(){saveCode();localStorage.setItem('court_library',JSON.stringify(state));message('BOT','Project saved.')}function load(){try{let x=JSON.parse(localStorage.getItem('court_library'));if(x?.files)state=x}catch{}render();assets()}function assets(){$('assets').innerHTML=state.assets.map(x=>esc(x)).join('<br>')}function run(){saveCode();let h=state.files['index.html']||'',c=state.files['style.css']||'',j=state.files['game.js']||'';$('screen').innerHTML='<iframe sandbox="allow-scripts" title="game"></iframe>';let f=$('screen').firstChild,d=f.contentDocument;d.open();d.write(h+'<style>'+c+'</style><script>'+j.replace(/<\/script>/gi,'<\\/script>')+'<\/script>');d.close()}function modal(title,body){$('mt').textContent=title;$('mb').innerHTML=body;$('modal').classList.add('show')}async function send(){let p=$('prompt').value.trim();if(!p)return;saveCode();$('prompt').value='';message('YOU',p);message('BOT','SENDING...');let payload={text:p,source:'courts-library',request:'game-builder',files:state.files};try{let sent=false;try{let r=await fetch(WEBHOOK,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});sent=r.ok||r.type==='opaque';if(!sent)throw Error('HTTP '+r.status)}catch(e){let blob=new Blob([JSON.stringify(payload)],{type:'application/json'});sent=navigator.sendBeacon(WEBHOOK,blob)}if(sent){message('BOT','Sent to Botpress.')}else throw Error('Browser blocked the request')}catch(e){message('BOT','Could not submit. In Botpress Webhook settings, add this site to Allowed Origins, or use the Botpress test emulator.')} }$('go').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();send()}};$('play').onclick=run;$('save').onclick=save;$('export').onclick=()=>{saveCode();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state.files,null,2)],{type:'application/json'}));a.download='courts-library-project.json';a.click()};$('assetInput').onchange=e=>{state.assets.push(...[...e.target.files].map(x=>x.name));assets();save()};$('close').onclick=()=>$('modal').classList.remove('show');$('bp').onclick=()=>modal('BOTPRESS','<p>Connected webhook:</p><p style="word-break:break-all">'+WEBHOOK+'</p><p>Webhook requests are one-way; Botpress does not return the bot answer in the webhook response.</p>');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view==='projects')modal('PROJECTS',localStorage.getItem('court_library')?'<div class="project" id="load">CURRENT PROJECT</div>':'<p>No saved project.</p>');if(b.dataset.view==='assets')modal('ASSETS','<p>Use ADD ASSET to select your GIFs, images or audio.</p>')});load();</script></body></html>
