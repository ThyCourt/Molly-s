<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly's - Music Channel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            background: #050510;
            position: relative;
        }

        /* ===== NIGHT SKY ===== */
        .night-sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a2a 0%, #050510 50%, #020208 100%);
            transition: opacity 1.5s ease;
        }

        /* ===== STARS ===== */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        .star-bright {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        @keyframes twinkle {
            0% {
                opacity: 0.1;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* ===== SHOOTING STARS ===== */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: linear-gradient(90deg, white, transparent);
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255,255,255,0.2);
            animation: shoot linear infinite;
            opacity: 0;
            z-index: 2;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 150px;
            height: 2px;
            background: linear-gradient(to left, rgba(255,255,255,0.6), transparent);
            transform: translateY(-50%);
        }

        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(-25deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(-800px, 500px) rotate(-25deg);
                opacity: 0;
            }
        }

        /* ===== CONTENT WRAPPER ===== */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        /* ===== BREATHING GLOW ===== */
        .glow-container {
            position: relative;
            padding: 25px;
            border-radius: 28px;
            background: transparent;
            animation: breathe 4.5s ease-in-out infinite;
            width: 100%;
            transition: all 0.5s ease;
        }

        @keyframes breathe {
            0%, 100% {
                box-shadow: 
                    0 0 80px rgba(255, 255, 255, 0.04),
                    0 0 150px rgba(100, 150, 255, 0.02),
                    inset 0 0 80px rgba(255, 255, 255, 0.02);
            }
            50% {
                box-shadow: 
                    0 0 120px rgba(255, 255, 255, 0.12),
                    0 0 250px rgba(100, 150, 255, 0.05),
                    inset 0 0 120px rgba(255, 255, 255, 0.04);
            }
        }

        /* ===== VIDEO WRAPPER ===== */
        .video-wrapper {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            background: #000;
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.9),
                0 0 60px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 750px;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            will-change: transform;
            aspect-ratio: 16/9;
        }

        .video-wrapper.magnet {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .video-wrapper.magnet:hover {
            transform: scale(1.04) rotate(0.3deg);
            box-shadow: 
                0 50px 120px rgba(0, 0, 0, 0.9),
                0 0 80px rgba(255, 255, 255, 0.12);
        }

        .video-wrapper.magnet::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(255, 255, 255, 0.08),
                transparent,
                rgba(100, 150, 255, 0.12),
                transparent,
                rgba(255, 255, 255, 0.08),
                transparent
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .video-wrapper.magnet:hover::before {
            opacity: 1;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            background: #000;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .video-wrapper.magnet:hover video {
            filter: brightness(1.05) contrast(1.02) saturate(1.02);
        }

        /* Skip indicator */
        .skip-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
            user-select: none;
        }

        .video-wrapper:hover .skip-indicator {
            opacity: 1;
        }

        /* ===== TITLE OVERLAY (BLACK GRADIENT) ===== */
        .title-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #050505 40%, #000000 100%);
            opacity: 0;
            visibility: hidden;
            transition: all 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
        }

        .title-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .title-content {
            text-align: center;
            animation: titleReveal 2s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
            position: relative;
            z-index: 1;
        }

        @keyframes titleReveal {
            0% {
                transform: scale(0.3) rotate(-5deg) skewX(10deg);
                opacity: 0;
                filter: blur(30px);
            }
            100% {
                transform: scale(1) rotate(0deg) skewX(0deg);
                opacity: 1;
                filter: blur(0);
            }
        }

        /* ===== MOLLY'S TITLE - INTER FONT ===== */
        .title-content h1 {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 900;
            font-size: clamp(4rem, 14vw, 8rem);
            letter-spacing: 12px;
            position: relative;
            background: linear-gradient(135deg, 
                #ffffff 0%, 
                #e8e0d5 20%,
                #ffffff 40%,
                #e8e0d5 60%,
                #ffffff 80%,
                #e8e0d5 100%
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s ease-in-out infinite;
            text-shadow: none;
            line-height: 1.1;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
        }

        .title-content h1:hover {
            transform: scale(1.03);
            letter-spacing: 18px;
            background: linear-gradient(135deg, 
                #ffffff 0%, 
                #d4cbb8 20%,
                #ffffff 40%,
                #d4cbb8 60%,
                #ffffff 80%,
                #d4cbb8 100%
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes shimmerText {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .title-content h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            border-radius: 2px;
            animation: linePulse 3s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .title-content h1:hover::after {
            width: 70%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        }

        @keyframes linePulse {
            0%, 100% {
                width: 30%;
                opacity: 0.3;
            }
            50% {
                width: 60%;
                opacity: 0.8;
            }
        }

        /* ===== MUSIC CHANNEL BUTTON - TELEGRAM GRADIENT ===== */
        .music-btn {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 18px 50px;
            background: linear-gradient(135deg, #0088cc 0%, #004d7a 40%, #003366 70%, #001a33 100%);
            background-size: 300% 300%;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(0, 136, 204, 0.4);
            animation: telegramGradient 4s ease-in-out infinite, floatBtn 3s ease-in-out infinite;
        }

        @keyframes telegramGradient {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes floatBtn {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .music-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Hover effects - interactive gradient changes */
        .music-btn:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 15px 50px rgba(0, 136, 204, 0.6);
            background: linear-gradient(135deg, #001a33 0%, #003366 30%, #004d7a 60%, #0088cc 100%);
            background-size: 300% 300%;
            animation: telegramGradient 1.5s ease-in-out infinite, floatBtn 2s ease-in-out infinite;
            letter-spacing: 5px;
        }

        .music-btn:hover::before {
            opacity: 1;
        }

        .music-btn:active {
            transform: scale(0.95) translateY(0px);
        }

        .music-btn svg {
            width: 32px;
            height: 32px;
            fill: white;
            flex-shrink: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .music-btn:hover svg {
            transform: rotate(-15deg) scale(1.2);
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }

        .music-btn span {
            position: relative;
            z-index: 1;
        }

        /* ===== VERSION TEXT ===== */
        .version-text {
            position: fixed;
            bottom: 20px;
            left: 25px;
            z-index: 50;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.65rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }

        .version-text:hover {
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .content-wrapper {
                max-width: 100%;
                padding: 0 10px;
            }

            .glow-container {
                padding: 15px;
            }

            .video-wrapper {
                max-width: 100%;
            }

            .video-wrapper.magnet:hover {
                transform: scale(1.02);
            }

            .title-content h1 {
                letter-spacing: 8px;
                font-size: clamp(3rem, 12vw, 5rem);
            }

            .title-content h1:hover {
                letter-spacing: 12px;
            }

            .title-content {
                gap: 35px;
            }

            .music-btn {
                padding: 14px 30px;
                font-size: 1rem;
                gap: 12px;
            }

            .music-btn svg {
                width: 24px;
                height: 24px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .glow-container {
                padding: 10px;
            }
            
            .title-content h1 {
                letter-spacing: 4px;
                font-size: clamp(2.5rem, 10vw, 3.5rem);
            }

            .title-content h1:hover {
                letter-spacing: 8px;
            }

            .title-content {
                gap: 25px;
            }

            .music-btn {
                padding: 12px 25px;
                font-size: 0.85rem;
                gap: 8px;
                letter-spacing: 2px;
            }

            .music-btn:hover {
                letter-spacing: 3px;
            }

            .music-btn svg {
                width: 20px;
                height: 20px;
            }

            .version-text {
                font-size: 0.5rem;
                bottom: 15px;
                left: 15px;
                letter-spacing: 1px;
            }
        }

        /* ===== VIDEO CONTROLS CUSTOM ===== */
        video::-webkit-media-controls-panel {
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
        }

        video::-webkit-media-controls-timeline {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
        }

        video::-webkit-media-controls-timeline:hover {
            background: rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <!-- ===== NIGHT SKY ===== -->
    <div class="night-sky" id="nightSky"></div>
    
    <!-- ===== STARS ===== -->
    <div class="stars" id="starsContainer"></div>

    <!-- ===== SHOOTING STARS ===== -->
    <div class="shooting-star" style="top: 5%; left: 75%; animation-delay: 2s; animation-duration: 3.5s;"></div>
    <div class="shooting-star" style="top: 12%; left: 20%; animation-delay: 5.5s; animation-duration: 4s;"></div>
    <div class="shooting-star" style="top: 3%; left: 50%; animation-delay: 8.5s; animation-duration: 3s;"></div>
    <div class="shooting-star" style="top: 8%; left: 60%; animation-delay: 11s; animation-duration: 4.5s;"></div>
    <div class="shooting-star" style="top: 15%; left: 85%; animation-delay: 14s; animation-duration: 3.8s;"></div>

    <!-- ===== VERSION TEXT ===== -->
    <div class="version-text">Court's Base11 Engine v1.0.1.25</div>

    <!-- ===== CONTENT ===== -->
    <div class="content-wrapper">
        <div class="glow-container">
            <div class="video-wrapper magnet" id="videoWrapper">
                <video id="mainVideo" playsinline controls>
                    <source src="video.mp4" type="video/mp4">
                    Your browser doesn't support HTML5 video.
                </video>
                <div class="skip-indicator">Press N to skip</div>
            </div>
        </div>
    </div>

    <!-- ===== TITLE OVERLAY ===== -->
    <div class="title-overlay" id="titleOverlay">
        <div class="title-content">
            <h1>MOLLY'S</h1>
            
            <a href="https://t.me/soabiker" target="_blank" class="music-btn" id="musicBtn">
                <svg viewBox="0 0 24 24">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                </svg>
                <span>Music Channel</span>
            </a>
        </div>
    </div>

    <script>
        // ===== GENERATE STARS =====
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = 600;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                const isBright = Math.random() > 0.85;
                star.className = isBright ? 'star-bright' : 'star';
                
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = isBright ? 1.5 + Math.random() * 2 : 0.5 + Math.random() * 1.5;
                const duration = 1.5 + Math.random() * 4;
                const delay = Math.random() * 6;
                const opacity = 0.2 + Math.random() * 0.8;
                
                let extraStyles = '';
                if (isBright) {
                    extraStyles = `box-shadow: 0 0 ${size * 3}px rgba(255,255,255,0.2);`;
                }
                
                star.style.cssText = `
                    left: ${x}%;
                    top: ${y}%;
                    width: ${size}px;
                    height: ${size}px;
                    --duration: ${duration}s;
                    animation-delay: ${delay}s;
                    opacity: ${opacity};
                    ${extraStyles}
                `;
                
                container.appendChild(star);
            }
        }

        createStars();

        // ===== VIDEO CONTROLS =====
        const video = document.getElementById('mainVideo');
        const titleOverlay = document.getElementById('titleOverlay');
        const videoWrapper = document.getElementById('videoWrapper');
        const nightSky = document.getElementById('nightSky');

        video.addEventListener('loadeddata', function() {
            console.log('✅ Video loaded! Duration:', video.duration, 'seconds');
        });

        video.addEventListener('error', function(e) {
            console.error('❌ Video failed to load:', e);
            console.log('📁 Make sure video.mp4 is in the same folder as index.html');
        });

        video.addEventListener('ended', function() {
            showTitle();
        });

        function showTitle() {
            titleOverlay.classList.add('show');
            videoWrapper.classList.remove('magnet');
            nightSky.style.opacity = '0.3';
        }

        function hideTitle() {
            titleOverlay.classList.remove('show');
            videoWrapper.classList.add('magnet');
            nightSky.style.opacity = '1';
        }

        function replayVideo() {
            video.currentTime = 0;
            video.play();
            hideTitle();
        }

        video.addEventListener('click', function() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        });

        // ===== SKIP WITH 'N' KEY =====
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'n' || e.key === 'N')) {
                if (!titleOverlay.classList.contains('show')) {
                    video.pause();
                    showTitle();
                    e.preventDefault();
                }
            }
            
            if (e.key === ' ' && !titleOverlay.classList.contains('show')) {
                e.preventDefault();
                video.paused ? video.play() : video.pause();
            }
            
            if (e.key === 'Escape' && titleOverlay.classList.contains('show')) {
                replayVideo();
                e.preventDefault();
            }
        });

        // Auto-play on load
        window.addEventListener('load', function() {
            video.play().catch(function() {
                document.addEventListener('click', function startVideo() {
                    video.play().catch(() => {});
                    document.removeEventListener('click', startVideo);
                }, { once: true });
            });
        });

        // ===== PARALLAX MAGNET EFFECT =====
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        document.addEventListener('mousemove', function(e) {
            const rect = videoWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const deltaX = (e.clientX - centerX) / rect.width;
            const deltaY = (e.clientY - centerY) / rect.height;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (distance < 1.5) {
                targetX = deltaX * 8;
                targetY = deltaY * 5;
            } else {
                targetX = 0;
                targetY = 0;
            }
        });

        function animateMagnet() {
            mouseX += (targetX - mouseX) * 0.06;
            mouseY += (targetY - mouseY) * 0.06;
            
            if (Math.abs(mouseX) > 0.01 || Math.abs(mouseY) > 0.01) {
                videoWrapper.style.transform = `scale(1.03) translate(${mouseX}px, ${mouseY}px) rotate(${mouseX * 0.08}deg)`;
                videoWrapper.style.boxShadow = `
                    0 50px 120px rgba(0,0,0,0.9),
                    0 0 100px rgba(255,255,255,${0.05 + Math.abs(mouseX) * 0.015})
                `;
            } else {
                videoWrapper.style.transform = '';
                videoWrapper.style.boxShadow = '';
            }
            
            requestAnimationFrame(animateMagnet);
        }

        if (!('ontouchstart' in window)) {
            animateMagnet();
        }

        // ===== RESIZE HANDLER =====
        function handleResize() {
            const wrapper = document.querySelector('.video-wrapper');
            const maxWidth = window.innerWidth - 40;
            if (maxWidth < 750) {
                wrapper.style.maxWidth = maxWidth + 'px';
            } else {
                wrapper.style.maxWidth = '750px';
            }
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        // ===== TELEGRAM BUTTON =====
        document.getElementById('musicBtn').addEventListener('click', function(e) {
            console.log('🚀 Opening Telegram channel...');
        });
