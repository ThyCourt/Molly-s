<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molly's - Music Channel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            background: #050510;
            position: relative;
            cursor: none;
        }

        /* ===== CUSTOM CURSOR ===== */
        .custom-cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, border-color 0.3s, background 0.3s;
            mix-blend-mode: difference;
        }

        .custom-cursor.hover {
            width: 40px;
            height: 40px;
            border-color: rgba(255,255,255,0.6);
            background: rgba(255,255,255,0.05);
        }

        .custom-cursor.click {
            width: 30px;
            height: 30px;
            border-color: rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.1);
        }

        /* ===== NIGHT SKY ===== */
        .night-sky {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: radial-gradient(ellipse at center, #0a0a2a 0%, #050510 50%, #020208 100%);
            transition: opacity 1.5s ease;
        }

        /* ===== AMBIENT GLOW ===== */
        .ambient-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(100,150,255,0.05) 0%, transparent 60%);
            transition: background 0.3s ease;
        }

        /* ===== STARS ===== */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        .star-bright {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            box-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        @keyframes twinkle {
            0% {
                opacity: 0.1;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1.5);
            }
        }

        /* ===== SHOOTING STARS ===== */
        .shooting-star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: linear-gradient(90deg, white, transparent);
            border-radius: 50%;
            box-shadow: 0 0 10px 3px rgba(255,255,255,0.2);
            animation: shoot linear infinite;
            opacity: 0;
            z-index: 2;
        }

        .shooting-star::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 150px;
            height: 2px;
            background: linear-gradient(to left, rgba(255,255,255,0.6), transparent);
            transform: translateY(-50%);
        }

        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(-25deg);
                opacity: 0;
            }
            5% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translate(-800px, 500px) rotate(-25deg);
                opacity: 0;
            }
        }

        /* ===== ORBITAL PARTICLES ===== */
        .orbital-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: orbit var(--duration) linear infinite;
            background: radial-gradient(circle, rgba(255,255,255,0.4), transparent);
            width: 4px;
            height: 4px;
        }

        @keyframes orbit {
            0% {
                transform: rotate(0deg) translateX(var(--radius)) rotate(0deg);
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: rotate(360deg) translateX(var(--radius)) rotate(-360deg);
                opacity: 0.3;
            }
        }

        /* ===== CONTENT WRAPPER ===== */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 750px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        /* ===== BREATHING GLOW ===== */
        .glow-container {
            position: relative;
            padding: 25px;
            border-radius: 28px;
            background: transparent;
            animation: breathe 4.5s ease-in-out infinite;
            width: 100%;
            transition: all 0.5s ease;
        }

        @keyframes breathe {
            0%, 100% {
                box-shadow: 
                    0 0 80px rgba(255, 255, 255, 0.04),
                    0 0 150px rgba(100, 150, 255, 0.02),
                    inset 0 0 80px rgba(255, 255, 255, 0.02);
            }
            50% {
                box-shadow: 
                    0 0 120px rgba(255, 255, 255, 0.12),
                    0 0 250px rgba(100, 150, 255, 0.05),
                    inset 0 0 120px rgba(255, 255, 255, 0.04);
            }
        }

        /* ===== VIDEO WRAPPER ===== */
        .video-wrapper {
            position: relative;
            border-radius: 22px;
            overflow: hidden;
            background: #000;
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.9),
                0 0 60px rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 750px;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            will-change: transform;
            aspect-ratio: 16/9;
            perspective: 1000px;
        }

        .video-wrapper.magnet {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .video-wrapper.magnet:hover {
            transform: scale(1.04) rotate(0.3deg);
            box-shadow: 
                0 50px 120px rgba(0, 0, 0, 0.9),
                0 0 80px rgba(255, 255, 255, 0.12);
        }

        .video-wrapper::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 24px;
            background: linear-gradient(60deg, 
                #667eea, #764ba2, #f093fb, #667eea
            );
            background-size: 300% 300%;
            animation: gradientBorder 3s ease infinite;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .video-wrapper:hover::before {
            opacity: 1;
        }

        @keyframes gradientBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .video-wrapper.magnet::after {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 24px;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                transparent,
                rgba(255, 255, 255, 0.08),
                transparent,
                rgba(100, 150, 255, 0.12),
                transparent,
                rgba(255, 255, 255, 0.08),
                transparent
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }

        .video-wrapper.magnet:hover::after {
            opacity: 1;
            animation: borderRotate 4s linear infinite;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            background: #000;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }

        .video-wrapper.magnet:hover video {
            filter: brightness(1.05) contrast(1.02) saturate(1.02);
        }

        .skip-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.7rem;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s ease;
            user-select: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skip-indicator kbd {
            background: rgba(255,255,255,0.1);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: rgba(255,255,255,0.4);
        }

        .video-wrapper:hover .skip-indicator {
            opacity: 1;
        }

        /* ===== TITLE OVERLAY ===== */
        .title-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #0a0a0a 0%, #050505 40%, #000000 100%);
            opacity: 0;
            visibility: hidden;
            transition: all 1.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 1000;
            pointer-events: none;
        }

        .title-overlay.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .title-content {
            text-align: center;
            animation: titleReveal 2s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
            z-index: 1;
        }

        @keyframes titleReveal {
            0% {
                transform: scale(0.3) rotate(-5deg) skewX(10deg);
                opacity: 0;
                filter: blur(30px);
            }
            100% {
                transform: scale(1) rotate(0deg) skewX(0deg);
                opacity: 1;
                filter: blur(0);
            }
        }

        /* ===== MOLLY'S TITLE ===== */
        .title-content h1 {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 900;
            font-size: clamp(4rem, 14vw, 8rem);
            letter-spacing: 12px;
            position: relative;
            background: linear-gradient(135deg, 
                #ffffff 0%, 
                #e8e0d5 20%,
                #ffffff 40%,
                #e8e0d5 60%,
                #ffffff 80%,
                #e8e0d5 100%
            );
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerText 4s ease-in-out infinite;
            text-shadow: none;
            line-height: 1.1;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-transform: uppercase;
            text-shadow: 
                0 0 20px rgba(255,255,255,0.1),
                0 0 40px rgba(100,150,255,0.05);
        }

        .title-content h1:hover {
            transform: scale(1.03);
            letter-spacing: 18px;
            text-shadow: 
                0 0 30px rgba(255,255,255,0.2),
                0 0 60px rgba(100,150,255,0.1),
                0 0 90px rgba(100,150,255,0.05);
        }

        @keyframes shimmerText {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .title-content h1::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 40%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            border-radius: 2px;
            animation: linePulse 3s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .title-content h1:hover::after {
            width: 70%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
        }

        @keyframes linePulse {
            0%, 100% {
                width: 30%;
                opacity: 0.3;
            }
            50% {
                width: 60%;
                opacity: 0.8;
            }
        }

        .letter {
            display: inline-block;
            animation: letterPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
        }

        @keyframes letterPop {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* ===== BUTTONS CONTAINER ===== */
        .buttons-container {
            display: flex;
            flex-direction: row;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }

        /* ===== MUSIC CHANNEL BUTTON ===== */
        .music-btn {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #0088cc 0%, #004d7a 40%, #003366 70%, #001a33 100%);
            background-size: 300% 300%;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(0, 136, 204, 0.4);
            animation: telegramGradient 4s ease-in-out infinite, floatBtn 3s ease-in-out infinite;
            backdrop-filter: blur(10px);
            min-width: 200px;
            justify-content: center;
        }

        @keyframes telegramGradient {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        @keyframes floatBtn {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .music-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .music-btn::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            width: 100px;
            height: 100px;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .music-btn:active::after {
            animation: ripple 0.6s ease-out forwards;
        }

        @keyframes ripple {
            0% {
                transform: scale(0);
                opacity: 0.5;
            }
            100% {
                transform: scale(4);
                opacity: 0;
            }
        }

        .music-btn:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 15px 50px rgba(0, 136, 204, 0.6);
            background: linear-gradient(135deg, #001a33 0%, #003366 30%, #004d7a 60%, #0088cc 100%);
            background-size: 300% 300%;
            animation: telegramGradient 1.5s ease-in-out infinite, floatBtn 2s ease-in-out infinite;
            letter-spacing: 5px;
        }

        .music-btn:hover::before {
            opacity: 1;
        }

        .music-btn:active {
            transform: scale(0.95) translateY(0px);
        }

        .music-btn svg {
            width: 28px;
            height: 28px;
            fill: white;
            flex-shrink: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .music-btn:hover svg {
            transform: rotate(-15deg) scale(1.2);
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }

        .music-btn span {
            position: relative;
            z-index: 1;
        }

        /* ===== INSTAGRAM BUTTON ===== */
        .instagram-btn {
            display: inline-flex;
            align-items: center;
            gap: 18px;
            padding: 16px 40px;
            background: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            background-size: 300% 300%;
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            text-decoration: none;
            letter-spacing: 3px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            box-shadow: 0 5px 30px rgba(225, 48, 108, 0.4);
            animation: instagramGradient 4s ease-in-out infinite, floatBtn 3s ease-in-out infinite 0.5s;
            backdrop-filter: blur(10px);
            min-width: 200px;
            justify-content: center;
        }

        @keyframes instagramGradient {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .instagram-btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 70%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .instagram-btn::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            width: 100px;
            height: 100px;
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }

        .instagram-btn:active::after {
            animation: ripple 0.6s ease-out forwards;
        }

        .instagram-btn:hover {
            transform: translateY(-12px) scale(1.05);
            box-shadow: 0 15px 50px rgba(225, 48, 108, 0.6);
            background: linear-gradient(135deg, #bc1888 0%, #cc2366 25%, #dc2743 50%, #e6683c 75%, #f09433 100%);
            background-size: 300% 300%;
            animation: instagramGradient 1.5s ease-in-out infinite, floatBtn 2s ease-in-out infinite 0.5s;
            letter-spacing: 5px;
        }

        .instagram-btn:hover::before {
            opacity: 1;
        }

        .instagram-btn:active {
            transform: scale(0.95) translateY(0px);
        }

        .instagram-btn svg {
            width: 28px;
            height: 28px;
            fill: white;
            flex-shrink: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .instagram-btn:hover svg {
            transform: rotate(-15deg) scale(1.2);
            filter: drop-shadow(0 0 20px rgba(255,255,255,0.3));
        }

        .instagram-btn span {
            position: relative;
            z-index: 1;
        }

        /* ===== KEYBOARD SHORTCUTS ===== */
        .shortcuts-hint {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.6rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.03);
            transition: opacity 0.5s ease;
        }

        .shortcuts-hint kbd {
            background: rgba(255,255,255,0.05);
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.55rem;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            color: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .shortcuts-hint span {
            opacity: 0.5;
        }

        /* ===== VERSION TEXT ===== */
        .version-text {
            position: fixed;
            bottom: 20px;
            left: 25px;
            z-index: 50;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.6rem;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-weight: 300;
            letter-spacing: 2px;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }

        /* ===== GLASS CARD ===== */
        .glass-card {
            position: fixed;
            bottom: 20px;
            right: 25px;
            z-index: 50;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px 20px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.55rem;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .content-wrapper {
                max-width: 100%;
                padding: 0 10px;
            }

            .glow-container {
                padding: 15px;
            }

            .video-wrapper {
                max-width: 100%;
            }

            .video-wrapper.magnet:hover {
                transform: scale(1.02);
            }

            .title-content h1 {
                letter-spacing: 8px;
                font-size: clamp(3rem, 12vw, 5rem);
            }

            .title-content h1:hover {
                letter-spacing: 12px;
            }

            .title-content {
                gap: 25px;
            }

            .buttons-container {
                gap: 15px;
            }

            .music-btn, .instagram-btn {
                padding: 14px 25px;
                font-size: 0.9rem;
                gap: 12px;
                min-width: 160px;
            }

            .music-btn svg, .instagram-btn svg {
                width: 22px;
                height: 22px;
            }

            .shortcuts-hint {
                bottom: 60px;
                font-size: 0.5rem;
                padding: 6px 15px;
                gap: 12px;
            }

            .shortcuts-hint kbd {
                font-size: 0.45rem;
                padding: 1px 8px;
            }

            .custom-cursor {
                display: none;
            }

                display: none;
            }

            .version-text {
                font-size: 0.5rem;
                bottom: 15px;
                left: 15px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;

            .glow-container {

            .title-content h1 {

                padding: 1px 6px;

            .version-text {

        /* ===== VIDEO CONTROLS CUSTOM ===== */
        video::-webkit-media-controls-panel {
            background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 100%);
        }

        video::-webkit-media-controls-timeline {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;

        video::-webkit-media-controls-timeline:hover {

        ::-webkit-scrollbar-thumb {

            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #764ba2, #f093fb);
        }
    </style>
</head>
<body>
    <!-- ===== CUSTOM CURSOR ===== -->
    <div class="custom-cursor" id="customCursor"></div>

    <!-- ===== NIGHT SKY ===== -->
    <div class="night-sky" id="nightSky"></div>

    <!-- ===== AMBIENT GLOW ===== -->
    <div class="ambient-glow" id="ambientGlow"></div>
    
    <!-- ===== STARS ===== -->
    <div class="stars" id="starsContainer"></div>

    <!-- ===== SHOOTING STARS ===== -->
    <div class="shooting-star" style="top: 5%; left: 75%; animation-delay: 2s; animation-duration: 3.5s;"></div>
    <div class="shooting-star" style="top: 12%; left: 20%; animation-delay: 5.5s; animation-duration: 4s;"></div>
    <div class="shooting-star" style="top: 3%; left: 50%; animation-delay: 8.5s; animation-duration: 3s;"></div>
    <div class="shooting-star" style="top: 8%; left: 60%; animation-delay: 11s; animation-duration: 4.5s;"></div>
    <div class="shooting-star" style="top: 15%; left: 85%; animation-delay: 14s; animation-duration: 3.8s;"></div>

    <!-- ===== VERSION TEXT ===== -->
    <div class="version-text">Court's Base11 Engine v1.0.1.25</div>

    <!-- ===== GLASS CARD ===== -->
    <div class="glass-card">✦ Now Playing</div>

    <!-- ===== KEYBOARD SHORTCUTS ===== -->
    <div class="shortcuts-hint">
        <kbd>N</kbd> <span>Skip</span>

    <!-- ===== CONTENT ===== -->
    <div class="content-wrapper">
        <div class="glow-container">

                <video id="mainVideo" playsinline controls>

                </video>

    </div>

    <!-- ===== TITLE OVERLAY ===== -->
    <div class="title-overlay" id="titleOverlay">
        <div class="title-content">
            <h1 id="mollyTitle">MOLLY'S</h1>
            
            <div class="buttons-container">
                <a href="https://t.me/soabiker" target="_blank" class="music-btn" id="musicBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                    </svg>
                    <span>Music Channel</span>
                </a>

                <a href="https://instagram.com/molly42069" target="_blank" class="instagram-btn" id="instagramBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
                    </svg>
                    <span>Instagram</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // ========================================
        // SOUND ENGINE - Complete Sound System
        // ========================================
        class SoundEngine {
            constructor() {
                this.audioCtx = null;
                this.isEnabled = true;
                this.volume = 0.08;
            }

            init() {
                if (!this.audioCtx) {
                    try {
                        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    } catch (e) {
                        this.isEnabled = false;
                    }
                }
                return this.isEnabled;
            }

            play(frequency, duration = 0.1, type = 'sine', volume = this.volume) {
                if (!this.isEnabled || !this.init()) return;
                
                try {
                    const oscillator = this.audioCtx.createOscillator();
                    const gainNode = this.audioCtx.createGain();
                    
                    oscillator.type = type;
                    oscillator.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);
                    
                    gainNode.gain.setValueAtTime(volume, this.audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + duration);
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioCtx.destination);
                    
                    oscillator.start();
                    oscillator.stop(this.audioCtx.currentTime + duration);
                } catch (e) {
                    // Silent fail
                }
            }

            // Different sound effects
            hover() {
                this.play(600 + Math.random() * 400, 0.08, 'sine', 0.04);
            }

            click() {
                this.play(800, 0.1, 'sine', 0.06);
                setTimeout(() => this.play(600, 0.08, 'sine', 0.04), 50);
            }

            success() {
                this.play(523, 0.1, 'sine', 0.05);
                setTimeout(() => this.play(659, 0.1, 'sine', 0.05), 100);
                setTimeout(() => this.play(784, 0.15, 'sine', 0.06), 200);
            }

            error() {
                this.play(300, 0.15, 'sawtooth', 0.03);
                setTimeout(() => this.play(200, 0.2, 'sawtooth', 0.03), 150);
            }

            videoPlay() {
                this.play(440, 0.05, 'sine', 0.03);
                setTimeout(() => this.play(554, 0.05, 'sine', 0.03), 50);
                setTimeout(() => this.play(659, 0.08, 'sine', 0.04), 100);
            }

            videoPause() {
                this.play(659, 0.05, 'sine', 0.03);
                setTimeout(() => this.play(554, 0.05, 'sine', 0.03), 50);
                setTimeout(() => this.play(440, 0.08, 'sine', 0.04), 100);
            }

            skip() {
                this.play(800, 0.05, 'sine', 0.05);
                setTimeout(() => this.play(1000, 0.05, 'sine', 0.05), 50);
                setTimeout(() => this.play(1200, 0.08, 'sine', 0.06), 100);
                setTimeout(() => this.play(1400, 0.1, 'sine', 0.07), 150);
            }

            replay() {
                this.play(1400, 0.05, 'sine', 0.05);
                setTimeout(() => this.play(1200, 0.05, 'sine', 0.05), 50);
                setTimeout(() => this.play(1000, 0.05, 'sine', 0.04), 100);
                setTimeout(() => this.play(800, 0.08, 'sine', 0.04), 150);
            }

            titleReveal() {
                this.play(523, 0.08, 'sine', 0.04);
                setTimeout(() => this.play(659, 0.08, 'sine', 0.04), 100);
                setTimeout(() => this.play(784, 0.08, 'sine', 0.05), 200);
                setTimeout(() => this.play(1047, 0.15, 'sine', 0.06), 300);
            }

            buttonHover() {
                this.play(500 + Math.random() * 300, 0.06, 'sine', 0.03);
            }

            videoHover() {
                this.play(400 + Math.random() * 200, 0.05, 'sine', 0.02);
            }

            keyPress() {
                this.play(700, 0.04, 'sine', 0.03);
                setTimeout(() => this.play(900, 0.04, 'sine', 0.03), 30);
            }
        }

        const sound = new SoundEngine();

        // ========================================
        // 1. GENERATE STARS
        // ========================================
        function createStars() {
            const container = document.getElementById('starsContainer');
            const starCount = 600;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                const isBright = Math.random() > 0.85;
                star.className = isBright ? 'star-bright' : 'star';
                
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const size = isBright ? 1.5 + Math.random() * 2 : 0.5 + Math.random() * 1.5;
                const duration = 1.5 + Math.random() * 4;
                const delay = Math.random() * 6;
                const opacity = 0.2 + Math.random() * 0.8;
                
                let extraStyles = '';
                if (isBright) {
                    extraStyles = `box-shadow: 0 0 ${size * 3}px rgba(255,255,255,0.2);`;
                }
                
                star.style.cssText = `
                    left: ${x}%;
                    top: ${y}%;
                    width: ${size}px;
                    height: ${size}px;
                    --duration: ${duration}s;
                    animation-delay: ${delay}s;
                    opacity: ${opacity};
                    ${extraStyles}
                `;
                
                container.appendChild(star);
            }
        }

        createStars();

        // ========================================
        // 2. ORBITAL PARTICLES
        // ========================================
        function createOrbitalParticles() {
            const wrapper = document.getElementById('videoWrapper');
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'orbital-particle';
                const angle = (i / 20) * Math.PI * 2;
                const radius = 120 + Math.random() * 60;
                particle.style.cssText = `
                    --duration: ${10 + Math.random() * 10}s;
                    --radius: ${radius}px;
                    top: 50%;
                    left: 50%;
                    transform-origin: 0 0;
                    background: radial-gradient(circle, rgba(255,255,255,${0.1 + Math.random() * 0.2}), transparent);
                    width: ${2 + Math.random() * 4}px;
                    height: ${2 + Math.random() * 4}px;
                    animation-delay: ${Math.random() * 5}s;
                `;
                wrapper.appendChild(particle);
            }
        }

        createOrbitalParticles();

        // ========================================
        // 3. CUSTOM CURSOR
        // ========================================
        const cursor = document.getElementById('customCursor');

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.querySelectorAll('.music-btn, .instagram-btn, .video-wrapper').forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.classList.add('hover');
                sound.buttonHover();
            });
            el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
            el.addEventListener('mousedown', () => cursor.classList.add('click'));
            el.addEventListener('mouseup', () => cursor.classList.remove('click'));
        });

        // ========================================
        // 4. AMBIENT GLOW
        // ========================================
        const ambientGlow = document.getElementById('ambientGlow');

        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            ambientGlow.style.background = `
                radial-gradient(circle at ${x}% ${y}%, 
                    rgba(100,150,255,0.08) 0%, 
                    rgba(118,75,162,0.04) 30%,
                    transparent 60%
                )
            `;
        });

        // ========================================
        // 5. LETTER-BY-LETTER ANIMATION
        // ========================================
        function animateTitleLetters() {
            const title = document.getElementById('mollyTitle');
            const text = title.textContent;
            title.textContent = '';
            
            text.split('').forEach((char, i) => {
                const span = document.createElement('span');
                span.className = 'letter';
                span.textContent = char === ' ' ? '\u00A0' : char;
                span.style.animationDelay = `${i * 0.08}s`;
                title.appendChild(span);
            });
        }

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.target.classList.contains('show')) {
                    setTimeout(() => {
                        animateTitleLetters();
                        sound.titleReveal();
                    }, 300);
                }
            });
        });

        observer.observe(document.getElementById('titleOverlay'), {
            attributes: true,
            attributeFilter: ['class']
        });

        // ========================================
        // 6. VIDEO CONTROLS WITH SOUND
        // ========================================
        const video = document.getElementById('mainVideo');
        const titleOverlay = document.getElementById('titleOverlay');
        const videoWrapper = document.getElementById('videoWrapper');
        const nightSky = document.getElementById('nightSky');

        video.addEventListener('loadeddata', function() {
            console.log('✅ Video loaded! Duration:', video.duration, 'seconds');
        });

        video.addEventListener('error', function(e) {
            console.error('❌ Video failed to load:', e);
        });

        video.addEventListener('ended', function() {
            showTitle();
            sound.success();
        });

        video.addEventListener('play', function() {
            sound.videoPlay();
        });

        video.addEventListener('pause', function() {
            sound.videoPause();
        });

        function showTitle() {
            titleOverlay.classList.add('show');
            videoWrapper.classList.remove('magnet');
            nightSky.style.opacity = '0.3';
        }

        function hideTitle() {
            titleOverlay.classList.remove('show');
            videoWrapper.classList.add('magnet');
            nightSky.style.opacity = '1';
        }

        function replayVideo() {
            video.currentTime = 0;
            video.play();
            hideTitle();
            sound.replay();
        }

        video.addEventListener('click', function() {
            if (video.paused) {
                video.play();
                sound.videoPlay();
            } else {
                video.pause();
                sound.videoPause();
            }
        });

        // ========================================
        // 7. KEYBOARD SHORTCUTS WITH SOUND
        // ========================================
        document.addEventListener('keydown', function(e) {
            if ((e.key === 'n' || e.key === 'N')) {
                if (!titleOverlay.classList.contains('show')) {
                    video.pause();
                    showTitle();
                    sound.skip();
                    e.preventDefault();
                }
            }
            
            if (e.key === ' ' && !titleOverlay.classList.contains('show')) {
                e.preventDefault();
                if (video.paused) {
                    video.play();
                    sound.videoPlay();
                } else {
                    video.pause();
                    sound.videoPause();
                }
            }
            
            if (e.key === 'Escape' && titleOverlay.classList.contains('show')) {
                replayVideo();
                e.preventDefault();
            }

            if (e.key === 'k' || e.key === 'K') {
                sound.keyPress();
            }
        });

        // ========================================
        // 8. 3D TILT EFFECT
        // ========================================
        videoWrapper.addEventListener('mousemove', (e) => {
            if (titleOverlay.classList.contains('show')) return;
            
            const rect = videoWrapper.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            
            videoWrapper.style.transform = `
                perspective(1000px)
                rotateY(${x * 15}deg)
                rotateX(${-y * 15}deg)
                scale(1.05)
            `;
        });

        videoWrapper.addEventListener('mouseleave', () => {
            if (titleOverlay.classList.contains('show')) return;
            videoWrapper.style.transform = '';
        });

        // ========================================
        // 9. PARALLAX MAGNET EFFECT
        // ========================================
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        document.addEventListener('mousemove', (e) => {
            if (titleOverlay.classList.contains('show')) return;
            
            const rect = videoWrapper.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const deltaX = (e.clientX - centerX) / rect.width;
            const deltaY = (e.clientY - centerY) / rect.height;
            
            const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (distance < 1.5) {
                targetX = deltaX * 8;
                targetY = deltaY * 5;
            } else {
                targetX = 0;
                targetY = 0;
            }
        });

        function animateMagnet() {
            mouseX += (targetX - mouseX) * 0.06;
            mouseY += (targetY - mouseY) * 0.06;
            
            if (Math.abs(mouseX) > 0.01 || Math.abs(mouseY) > 0.01) {
                if (!titleOverlay.classList.contains('show')) {
                    videoWrapper.style.transform = `scale(1.03) translate(${mouseX}px, ${mouseY}px) rotate(${mouseX * 0.08}deg)`;
                    videoWrapper.style.boxShadow = `
                        0 50px 120px rgba(0,0,0,0.9),
                        0 0 100px rgba(255,255,255,${0.05 + Math.abs(mouseX) * 0.015})
                    `;
                }
            } else {
                if (!titleOverlay.classList.contains('show')) {
                    videoWrapper.style.transform = '';
                    videoWrapper.style.boxShadow = '';
                }
            }
            
            requestAnimationFrame(animateMagnet);
        }

        if (!('ontouchstart' in window)) {
            animateMagnet();
        }

        // ========================================
        // 10. BUTTON SOUND EFFECTS
        // ========================================
        document.querySelectorAll('.music-btn, .instagram-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                sound.buttonHover();
            });
            
            btn.addEventListener('click', () => {
                sound.click();
            });
        });

        // ========================================
        // 11. VIDEO HOVER SOUND
        // ========================================
        videoWrapper.addEventListener('mouseenter', () => {
            if (!titleOverlay.classList.contains('show')) {
                sound.videoHover();
            }
        });

        // ========================================
        // 12. RESIZE HANDLER
        // ========================================
        function handleResize() {
            const wrapper = document.querySelector('.video-wrapper');
            const maxWidth = window.innerWidth - 40;
            if (maxWidth < 750) {
                wrapper.style.maxWidth = maxWidth + 'px';
            } else {
                wrapper.style.maxWidth = '750px';
            }
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        // ========================================
        // 13. AUTO-PLAY
        // ========================================
        window.addEventListener('load', function() {
            video.play().catch(function() {
                document.addEventListener('click', function startVideo() {
                    video.play().catch(() => {});
                    document.removeEventListener('click', startVideo);
                }, { once: true });
            });
        });

        // ========================================
        // 14. CONSOLE LOGS
        // ========================================
        console.log('🌙 Night sky loaded with', document.querySelectorAll('.star').length, 'stars');
        console.log('🔄 Orbital particles active!');
        console.log('📱 Press N to skip to Molly\'s title');
        console.log('📺 Version: Court\'s Base11 Engine v1.0.1.25');
        console.log('💬 Using Inter font everywhere!');
        console.log('✨ 3D tilt effect enabled');
        console.log('🎵 Complete sound system active!');
        console.log('🖱️ Custom cursor active');
        console.log('📸 Instagram button added: @molly42069');
    </script>
</body>
